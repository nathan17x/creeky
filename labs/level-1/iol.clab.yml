# Level 1 on real Cisco IOL (not wired up yet; see docs/containerlab.md).
# Requires a vrnetlab-built IOL image loaded on the lab host.
name: creeky-l1
topology:
  nodes:
    workstation:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
    sw1:
      kind: cisco_iol
      type: L2
      image: vrnetlab/cisco_iol:L2-17.12.01
      startup-config: sw1-iol.cfg
  links:
    - endpoints: ["workstation:eth1", "sw1:Ethernet0/1"]
