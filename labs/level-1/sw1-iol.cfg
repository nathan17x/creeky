hostname SW1
ip domain name lab.local
username admin privilege 1 secret creek123
enable secret dam123
crypto key generate rsa modulus 2048
ip ssh version 2
interface Ethernet0/1
 description to-workstation
 switchport mode access
interface Vlan1
 description management
 ip address 10.10.10.2 255.255.255.0
 no shutdown
banner motd ^ Creek Lab SW1 - authorized trainees only ^
line vty 0 4
 login local
 transport input ssh
end
